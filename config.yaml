# config.yaml — Физические константы и параметры модели
# GAK-001 Bio-Diffusion v0.6

physics_constants:
  T: 310.0          # K
  kB: 1.380649e-23  # Дж/К
  e: 1.602176634e-19  # Кл
  NA: 6.02214076e23    # 1/моль
  R: 8.314462618       # Дж/(моль·К)
  F: 96485.33212       # Кл/моль
  eps0: 8.8541878128e-12  # Ф/м
  RT: 2578.48        # Дж/моль = R * T
  F_RT: 37.44        # 1/В = F / (R * T)
  thermal_voltage: 0.02569  # В = RT / F

ion_species:
  Na:
    D: 1.33e-9      # м²/с
    z: 1
    c0: 145.0        # мМ
  K:
    D: 1.96e-9      # м²/с
    z: 1
    c0: 4.0          # мМ
  Cl:
    D: 2.03e-9      # м²/с
    z: -1
    c0: 110.0        # мМ
  Ca:
    D: 0.79e-9      # м²/с
    z: 2
    c0: 1.0          # мМ

graph:
  N: 20
  topology: "chain"
  conductivity: 1.0
  cross_section: 1.0e-8

solver:
  dt: 0.01          # с
  membrane_potential: -1.8    # В (на мембране)
  eps_relative: 1.0
  picard_tol: 1.0e-6
  picard_max_iter: 20
  steady_state_tol: 1.0e-10
  analyze_every: 0            # 0 = ИИ-анализ выключен

neuron:
  enabled: true
  neuron_nodes: [5, 10, 15]
  dt: 0.01
  use_nernst: false           # true = E_Na/E_K из концентраций
  g_Na: 120.0
  g_K: 36.0
  g_L: 0.3
  E_Na: 50.0
  E_K: -75.0
  E_L: -54.3
  C_m: 1.0
  V_rest: -65.0
  V_clip_min: -90.0
  V_clip_max: 60.0
  analyze_every: 0

simulation:
  n_steps: 100
  output_every: 10
