# config.yaml — Физические константы и параметры модели
# GAK-001 Bio-Diffusion v0.3.1

physics_constants:
  # Температура (физиологическая / лабораторная)
  T: 310.0          # K
  kB: 1.380649e-23  # Дж/К (постоянная Больцмана)
  e: 1.602176634e-19  # Кл (элементарный заряд)
  NA: 6.02214076e23    # 1/моль (число Авогадро)
  R: 8.314462618       # Дж/(моль·К)
  F: 96485.33212       # Кл/моль (постоянная Фарадея)
  eps0: 8.8541878128e-12  # Ф/м (вакуумная проницаемость)

  # Производные константы
  RT: 2578.48        # Дж/моль = R * T
  F_RT: 38.94        # 1/В = F / (R * T) — ключевой нормализатор потенциала
  thermal_voltage: 0.02569  # В = RT / F (V_T при 310 K)

# Эталонные параметры ионов (в СИ)
ion_species:
  Na:
    D: 1.33e-9      # м²/с (Na+ в воде при 310 K)
    z: 1
    c0: 145.0        # мМ (внеклеточная концентрация)
  K:
    D: 1.96e-9      # м²/с (K+ в воде при 310 K)
    z: 1
    c0: 4.0          # мМ (внеклеточная концентрация)
  Cl:
    D: 2.03e-9      # м²/с (Cl- в воде при 310 K)
    z: -1
    c0: 110.0        # мМ (внеклеточная концентрация)

# Параметры решателя
solver:
  dt: 1.0e-7        # с (шаг по времени)
  eps_relative: 1.0  # относительная диэлектрическая проницаемость среды
  picard_tol: 1.0e-8
  picard_max_iter: 50
  steady_state_tol: 1.0e-10
