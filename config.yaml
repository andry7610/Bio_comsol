# config.yaml — Физические константы и параметры модели
# GAK-001 Bio-Diffusion v0.9

physics_constants:
  T: 310.0
  kB: 1.380649e-23
  e: 1.602176634e-19
  NA: 6.02214076e23
  R: 8.314462618
  F: 96485.33212
  eps0: 8.8541878128e-12
  RT: 2578.48
  F_RT: 37.44
  thermal_voltage: 0.02569

ion_species:
  Na:
    D: 1.33e-9
    z: 1
    c0: 145.0
  K:
    D: 1.96e-9
    z: 1
    c0: 4.0
  Cl:
    D: 2.03e-9
    z: -1
    c0: 110.0
  Ca:
    D: 0.79e-9
    z: 2
    c0: 1.0

graph:
  N: 20
  topology: "chain"
  conductivity: 1.0
  cross_section: 1.0e-8

solver:
  dt: 0.01
  membrane_potential: -1.8
  eps_relative: 1.0
  picard_tol: 1.0e-6
  picard_max_iter: 20
  steady_state_tol: 1.0e-10
  analyze_every: 0
  self_consistent: false
  poisson_lambda: 1.0
  use_newton: false
  newton_tol: 1.0e-8
  newton_max_iter: 5

neuron:
  enabled: true
  neuron_nodes: [5, 10, 15]
  dt: 0.01
  use_nernst: false
  g_Na: 120.0
  g_K: 36.0
  g_L: 0.3
  E_Na: 50.0
  E_K: -75.0
  E_L: -54.3
  C_m: 1.0
  V_rest: -65.0
  V_clip_min: -90.0
  V_clip_max: 60.0
  analyze_every: 0

synapse:
  enabled: false
  V_threshold: -20.0
  use_stdp: false
  A_plus: 0.01
  A_minus: 0.012
  tau_plus: 20.0
  tau_minus: 20.0
  w_min: 0.0
  w_max: 10.0
  synapses:
    - {pre: 5, post: 10, weight: 0.5, E_syn: 0.0, tau_syn: 3.0, synapse_type: "excitatory"}
    - {pre: 10, post: 15, weight: 0.3, E_syn: 0.0, tau_syn: 3.0, synapse_type: "excitatory"}
    - {pre: 15, post: 5, weight: 0.2, E_syn: -80.0, tau_syn: 5.0, synapse_type: "inhibitory"}

simulation:
  n_steps: 100
  output_every: 10
# === END ===
