name: Bio-COMSOL Tests

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

        steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scipy pytest

      - name: Run tests
        run: python -m pytest tests/ -v
